# Test configuration for the Authorization Code + PKCE flow.
# A fixed issuer so the RFC 9207 `iss` and the token `iss` claim are assertable.
iam.oidc.issuer=https://issuer.test.example

# Short, deterministic lifetimes for the flow tests.
iam.authflow.code-ttl=PT2M
iam.authflow.access-token-ttl=PT5M
iam.authflow.id-token-ttl=PT5M

# Rate limiting is OFF by default in tests so the flow tests (which fire several authorize/token
# requests in a burst) never trip it. The dedicated limiter tests re-enable it with tight caps
# via @TestProfile.
iam.ratelimit.enabled=false

# Most of this module's flow tests simulate "an upstream authenticating proxy already
# established the caller's identity" by setting X-Subject-Id directly — exactly the trusted-edge
# deployment mode iam.subject.trust-header gates (production default: false, closed). Opting in
# here, module-wide, is what those tests are actually testing (OAuth mechanics), not the
# trust-header boundary itself; SubjectHeaderTrustBoundaryTest overrides this back to false via
# @TestProfile to prove the real (production) default independently.
iam.subject.trust-header=true
