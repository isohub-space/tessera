<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<link rel="stylesheet" href="assets/signin.css">
</head>
<body>
<main>
<h1>Sign in</h1>
{#if failed}
<p class="error" role="alert">The username or password is incorrect.</p>
{/if}
<form method="post" action="signin">
<input type="hidden" name="txn" value="{transactionId}">
<input type="hidden" name="csrf" value="{csrfToken}">
<label for="username">Username</label>
<input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button>
</form>
</main>
</body>
</html>
