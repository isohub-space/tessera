name: pr-hygiene

# Server-side gate for the PUBLIC-facing surfaces that commit-lint does not cover:
#   - the pull-request TITLE and BODY, and the added lines of the diff (blocking, per-commit);
#   - PR/issue COMMENT bodies (detect-and-hide — a comment is not a commit, so it cannot be a
#     merge-blocking required check; the offending comment is minimized and a short note posted).
# Both block two classes of leak into the public repo:
#   - AI-attribution / agent markers (Co-Authored-By: Claude…, Claude-Session:, claude.ai/code,
#     "generated/authored with Claude", anthropic.com, the robot emoji)
#   - internal issue-tracker keys (matched by shape, not by a list of project codes — see the
#     comment above has_internal_leak) and any hosted-tracker tenant host
# commit-lint enforces the same on commit messages/authors; this closes the remaining gaps.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write   # to hide a flagged comment and post a short note

env:
  # This repo's own vault/tracker space code. Its ADR-<code>-… prefix names this project's
  # own public decision records, not a leaked reference into someone else's internal space —
  # so it is the one letter-coded ADR prefix this gate lets through. Every other letter-coded
  # ADR-<code>- prefix stays blocked, and this does NOT extend to the bare <code>-<digits>
  # issue-key pattern (<code>-<digits>) — that still names a private backlog issue and citing one
  # in public text is still a leak regardless of this repo's own project code. Note that
  # "IAM-002" is itself a substring of "ADR-IAM-002": the check below has to tell the two
  # apart per occurrence, not by scanning each pattern separately over the whole text —
  # otherwise an own-project ADR reference trips the issue-key clause on its own tail.
  OWN_PROJECT: IAM

jobs:
  hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: PR text and diff must be neutral (no AI attribution, no internal keys)
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ai='co-authored-by:[[:space:]]*(claude|anthropic)|claude-session:|claude\.ai/code|generated (with|by) \[?claude|authored (with|by)[^.]*claude|anthropic\.com|🤖'
          own_project="$OWN_PROJECT"
          # Internal tracker keys are matched by SHAPE, not by a list of project codes: a literal list
          # would itself publish the private project codes this gate keeps out of public metadata, and
          # would silently miss every project added after it was written.
          #   - upper-case KEY-123 / KEY-S4 anywhere outside an http(s) URL
          #   - lower-case key-123 only as a path segment (dir/key-123) or a key-123.md file name, so
          #     case-insensitive coverage does not flag hyphenated prose such as "non-404" or "top-10"
          #   - ADR-<code>-<n> for any <code> but this repo's own (see own_project above)
          #   - any *.atlassian.net tenant host
          # http(s) URLs (other projects' public trackers; file:// and app links stay scanned), version strings (surefire-3.5.6) and the public
          # identifier schemes that share the KEY-123 shape (SHA-256, UTF-8, RFC-7636 …) pass.
          public_schemes='ADR|AES|CVE|CWE|ECMA|FIPS|GHSA|HTTP|IEC|IEEE|ISO|JDK|JEP|JSR|NIST|OQ|OWASP|PKCE|PKCS|RFC|SHA|TLS|UTF'
          b='(^|[^A-Za-z0-9_-])'
          # A token runs to the end of its word, so PKCE-S256 is read whole and then rejected by the
          # number/sprint check below; the separator after it stays free to bound the next token.
          e='[A-Za-z0-9_]*'
          tok_re="${b}ADR-[A-Z][A-Z0-9]+-[0-9]+|${b}[A-Z][A-Z0-9]+-(S[0-9]{1,2}|[0-9]+)(\.[0-9]+)*${e}|[A-Za-z_]/[a-z][a-z0-9]+-(s[0-9]{1,2}|[0-9]+)(\.[0-9]+)*${e}|${b}[a-z][a-z0-9]+-(s[0-9]{1,2}|[0-9]+)\.md"
          has_internal_leak() {
            local tok key
            # Here-strings, not printf | grep -q: under pipefail an early-exiting grep can SIGPIPE the
            # writer and turn a match into a pass.
            grep -qiE '[a-z0-9-]+\.atlassian\.net' <<<"$1" && return 0
            while IFS= read -r tok; do
              tok=${tok%.md}
              [[ $tok =~ -[Ss]?[0-9]+\.[0-9] ]] && continue                  # version string
              key=$(printf '%s' "$tok" | sed -E 's#[^A-Za-z0-9]$##; s#^.*[^A-Za-z0-9-]##' | tr '[:lower:]' '[:upper:]')
              # a key ends in a number or a sprint id (S plus one or two digits): PKCE-S256 does not
              [[ $key =~ ^ADR- || $key =~ -(S[0-9]{1,2}|[0-9]+)(\.[0-9]+)*$ ]] || continue
              case "$key" in
                "") continue ;;
                "ADR-${own_project}-"*) continue ;;
                ADR-*-*) return 0 ;;
              esac
              [[ ${key%%-*} =~ ^($public_schemes)$ ]] && continue
              return 0
            done < <(sed -E 's#%2[Ff]#/#g; s#[Hh][Tt][Tt][Pp][Ss]?://[^[:space:]<>()"]*##g' <<<"$1" | grep -oE "$tok_re")
            return 1
          }
          fail=0

          # 1) PR title + body — the surface commit-lint cannot see.
          text="$TITLE"$'\n'"$BODY"
          if grep -qiE "$ai" <<<"$text"; then
            echo "::error::PR title/body carries an AI-attribution/agent marker — remove it (human-authored, neutral text only)."; fail=1
          fi
          if has_internal_leak "$text"; then
            echo "::error::PR title/body carries an internal tracker key or a foreign project's ADR-<code>- prefix — keep public text neutral."; fail=1
          fi

          # 2) Added lines of the PR diff. The guard files themselves contain these patterns by
          #    design, so they are excluded from the scan.
          added=$(git diff --unified=0 "$BASE...$HEAD" -- . \
                    ':(exclude).github/workflows/pr-hygiene.yml' \
                    ':(exclude).github/workflows/commit-lint.yml' \
                    ':(exclude).githooks/pre-push' \
                    ':(exclude)scripts/test-neutral-metadata.sh' \
                  | grep -E '^\+' | grep -vE '^\+\+\+' || true)
          if grep -qiE "$ai" <<<"$added"; then
            echo "::error::A changed line adds an AI-attribution/agent marker — remove it."; fail=1
          fi
          if has_internal_leak "$added"; then
            echo "::error::A changed line adds an internal tracker key or a foreign project's ADR-<code>- prefix — the public repo must stay neutral."; fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "pr-hygiene failed. See the errors above; scrub the offending text before merging."
            exit 1
          fi
          echo "PR text and diff are neutral (no AI attribution, no internal keys)."

  selftest:
    # Runs the hook and both workflows' real scripts against seeded leaks and clean inputs, so a
    # clause that silently stops matching fails here instead of waving leaks through.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Neutral-metadata regression cases
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          bash scripts/test-neutral-metadata.sh

  comment:
    # A PR/issue comment is not a commit, so this cannot be a merge-blocking required check.
    # Instead: detect a marker in the comment body and hide it (minimize) + post a short note.
    # Skip the bot's own notes so it can never act on itself (no loop).
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.comment.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Hide a comment carrying an AI-attribution marker or internal key
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.comment.body }}
          NODE_ID: ${{ github.event.comment.node_id }}
          HTML_URL: ${{ github.event.comment.html_url }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ai='co-authored-by:[[:space:]]*(claude|anthropic)|claude-session:|claude\.ai/code|generated (with|by) \[?claude|authored (with|by)[^.]*claude|anthropic\.com|🤖'
          own_project="$OWN_PROJECT"
          # Internal tracker keys are matched by SHAPE, not by a list of project codes: a literal list
          # would itself publish the private project codes this gate keeps out of public metadata, and
          # would silently miss every project added after it was written.
          #   - upper-case KEY-123 / KEY-S4 anywhere outside an http(s) URL
          #   - lower-case key-123 only as a path segment (dir/key-123) or a key-123.md file name, so
          #     case-insensitive coverage does not flag hyphenated prose such as "non-404" or "top-10"
          #   - ADR-<code>-<n> for any <code> but this repo's own (see own_project above)
          #   - any *.atlassian.net tenant host
          # http(s) URLs (other projects' public trackers; file:// and app links stay scanned), version strings (surefire-3.5.6) and the public
          # identifier schemes that share the KEY-123 shape (SHA-256, UTF-8, RFC-7636 …) pass.
          public_schemes='ADR|AES|CVE|CWE|ECMA|FIPS|GHSA|HTTP|IEC|IEEE|ISO|JDK|JEP|JSR|NIST|OQ|OWASP|PKCE|PKCS|RFC|SHA|TLS|UTF'
          b='(^|[^A-Za-z0-9_-])'
          # A token runs to the end of its word, so PKCE-S256 is read whole and then rejected by the
          # number/sprint check below; the separator after it stays free to bound the next token.
          e='[A-Za-z0-9_]*'
          tok_re="${b}ADR-[A-Z][A-Z0-9]+-[0-9]+|${b}[A-Z][A-Z0-9]+-(S[0-9]{1,2}|[0-9]+)(\.[0-9]+)*${e}|[A-Za-z_]/[a-z][a-z0-9]+-(s[0-9]{1,2}|[0-9]+)(\.[0-9]+)*${e}|${b}[a-z][a-z0-9]+-(s[0-9]{1,2}|[0-9]+)\.md"
          has_internal_leak() {
            local tok key
            # Here-strings, not printf | grep -q: under pipefail an early-exiting grep can SIGPIPE the
            # writer and turn a match into a pass.
            grep -qiE '[a-z0-9-]+\.atlassian\.net' <<<"$1" && return 0
            while IFS= read -r tok; do
              tok=${tok%.md}
              [[ $tok =~ -[Ss]?[0-9]+\.[0-9] ]] && continue                  # version string
              key=$(printf '%s' "$tok" | sed -E 's#[^A-Za-z0-9]$##; s#^.*[^A-Za-z0-9-]##' | tr '[:lower:]' '[:upper:]')
              # a key ends in a number or a sprint id (S plus one or two digits): PKCE-S256 does not
              [[ $key =~ ^ADR- || $key =~ -(S[0-9]{1,2}|[0-9]+)(\.[0-9]+)*$ ]] || continue
              case "$key" in
                "") continue ;;
                "ADR-${own_project}-"*) continue ;;
                ADR-*-*) return 0 ;;
              esac
              [[ ${key%%-*} =~ ^($public_schemes)$ ]] && continue
              return 0
            done < <(sed -E 's#%2[Ff]#/#g; s#[Hh][Tt][Tt][Pp][Ss]?://[^[:space:]<>()"]*##g' <<<"$1" | grep -oE "$tok_re")
            return 1
          }
          if grep -qiE "$ai" <<<"$BODY" || has_internal_leak "$BODY"; then
            echo "Comment $HTML_URL matched a hygiene pattern — hiding it."
            gh api graphql -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { minimizedComment { isMinimized } } }' -f id="$NODE_ID"
            gh api "repos/$REPO/issues/$ISSUE/comments" \
              -f body=":lock: A comment was auto-hidden by pr-hygiene: it contained an AI-attribution marker or an internal tracker key. Please repost with neutral, human-authored text."
          else
            echo "Comment is neutral."
          fi
